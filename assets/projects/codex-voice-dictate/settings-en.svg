<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="desktop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#d9e5f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#26384b" flood-opacity="0.19"/>
    </filter>
    <clipPath id="windowClip"><rect x="24" y="16" width="1152" height="768" rx="13"/></clipPath>
    <clipPath id="contentClip"><rect x="25" y="147" width="1150" height="587"/></clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#desktop)"/>
  <rect x="24" y="16" width="1152" height="768" rx="13" fill="#ffffff" filter="url(#shadow)"/>
  <g clip-path="url(#windowClip)" font-family="Arial, Helvetica, sans-serif">
    <!-- Windows title bar -->
    <rect x="24" y="16" width="1152" height="56" fill="#0878ca"/>
    <rect x="48" y="33" width="20" height="23" rx="5" fill="#ffffff" opacity="0.96"/>
    <rect x="54" y="39" width="8" height="10" rx="4" fill="#0878ca"/>
    <path d="M52 49Q58 59 64 49M58 56V62M52 62H64" stroke="#0878ca" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="84" y="51" font-size="21" fill="#ffffff">Codex Voice Dictate — Settings</text>
    <path d="M1040 43h18" stroke="#ffffff" stroke-width="2"/>
    <rect x="1095" y="35" width="17" height="17" rx="2" fill="none" stroke="#d4e7f8" stroke-width="1.8"/>
    <path d="M1142 35l18 18m0-18l-18 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Header -->
    <rect x="24" y="72" width="1152" height="75" fill="#ffffff"/>
    <path d="M24 147h1152" stroke="#e2e7ee" stroke-width="1"/>
    <text x="66" y="109" font-size="25" font-weight="700" fill="#162436">Dictation settings</text>
    <text x="66" y="134" font-size="16" fill="#627386">Configure the microphone workflow, language recognition and shortcuts.</text>

    <!-- Scrollable content -->
    <rect x="24" y="148" width="1152" height="586" fill="#f5f7fa"/>
    <g clip-path="url(#contentClip)">
      <!-- Connection card -->
      <rect x="66" y="165" width="1060" height="198" rx="11" fill="#ffffff" stroke="#dde4ec"/>
      <text x="93" y="198" font-size="20" font-weight="700" fill="#17283b">Connection</text>
      <text x="93" y="229" font-size="17" font-weight="700" fill="#263747">OpenAI API key</text>
      <rect x="93" y="239" width="1005" height="37" rx="5" fill="#ffffff" stroke="#bbc9d8"/>
      <g fill="#263747">
        <circle cx="110" cy="258" r="4"/><circle cx="124" cy="258" r="4"/><circle cx="138" cy="258" r="4"/><circle cx="152" cy="258" r="4"/>
        <circle cx="166" cy="258" r="4"/><circle cx="180" cy="258" r="4"/><circle cx="194" cy="258" r="4"/><circle cx="208" cy="258" r="4"/>
        <circle cx="222" cy="258" r="4"/><circle cx="236" cy="258" r="4"/><circle cx="250" cy="258" r="4"/><circle cx="264" cy="258" r="4"/>
      </g>
      <text x="93" y="296" font-size="15" fill="#657487">Stored encrypted for this Windows user. Leave blank to use OPENAI_API_KEY.</text>
      <path d="M93 310h1005" stroke="#e7ebf0"/>
      <text x="93" y="335" font-size="16" font-weight="700" fill="#263747">Dictation target</text>
      <text x="246" y="335" font-size="16" fill="#496174">IntelliJ IDEA — project chat composer</text>
      <text x="93" y="354" font-size="14" fill="#728397">Focus a text field in any app and press Ctrl+Alt+B to bind it.</text>

      <!-- Speech recognition card -->
      <rect x="66" y="380" width="1060" height="236" rx="11" fill="#ffffff" stroke="#dde4ec"/>
      <text x="93" y="414" font-size="20" font-weight="700" fill="#17283b">Speech recognition</text>
      <text x="93" y="443" font-size="17" font-weight="700" fill="#263747">Languages</text>
      <text x="192" y="443" font-size="15" fill="#657487">Select languages, or leave all unchecked for automatic detection.</text>
      <g font-size="16" fill="#253649">
        <rect x="93" y="459" width="20" height="20" rx="4" fill="#1477c9" stroke="#1477c9"/>
        <path d="M98 469l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="122" y="475">English (en)</text>
        <rect x="327" y="459" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="356" y="475">German (de)</text>
        <rect x="560" y="459" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="589" y="475">French (fr)</text>
        <rect x="796" y="459" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="825" y="475">Spanish (es)</text>
        <rect x="93" y="488" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="122" y="504">Italian (it)</text>
        <rect x="327" y="488" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="356" y="504">Portuguese (pt)</text>
        <rect x="560" y="488" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="589" y="504">Ukrainian (uk)</text>
        <rect x="796" y="488" width="20" height="20" rx="4" fill="#ffffff" stroke="#9aa8b7" stroke-width="1.6"/>
        <text x="825" y="504">Polish (pl)</text>
      </g>
      <path d="M93 519h1005" stroke="#e7ebf0"/>
      <rect x="93" y="536" width="20" height="20" rx="4" fill="#1477c9" stroke="#1477c9"/>
      <path d="M98 546l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="552" font-size="16" fill="#253649" font-weight="700">Correct technical terms and punctuation</text>
      <text x="93" y="582" font-size="16" font-weight="700" fill="#263747">Correction model</text>
      <rect x="257" y="562" width="841" height="37" rx="5" fill="#ffffff" stroke="#bbc9d8"/>
      <text x="272" y="586" font-size="16" fill="#253649">GPT-6 Luna — economical</text>
      <path d="M1072 578l6 6 6-6" stroke="#657487" stroke-width="2" fill="none"/>

      <!-- Third section continues beneath the fixed footer -->
      <rect x="66" y="633" width="1060" height="235" rx="11" fill="#ffffff" stroke="#dde4ec"/>
      <text x="93" y="667" font-size="20" font-weight="700" fill="#17283b">Dictation controls</text>
      <text x="93" y="694" font-size="16" font-weight="700" fill="#263747">Start / stop · insert</text>
      <text x="607" y="694" font-size="16" font-weight="700" fill="#263747">Stop and send</text>
      <rect x="93" y="704" width="483" height="38" rx="5" fill="#ffffff" stroke="#bbc9d8"/>
      <rect x="607" y="704" width="491" height="38" rx="5" fill="#ffffff" stroke="#bbc9d8"/>
      <text x="107" y="730" font-size="16" fill="#263747">F8</text>
      <text x="621" y="730" font-size="16" fill="#263747">F9</text>
    </g>

    <!-- Vertical content scrollbar -->
    <rect x="1146" y="160" width="5" height="559" rx="3" fill="#e5e9ef"/>
    <rect x="1146" y="174" width="5" height="275" rx="3" fill="#aeb8c4"/>

    <!-- Fixed footer -->
    <rect x="24" y="734" width="1152" height="50" fill="#ffffff"/>
    <path d="M24 734h1152" stroke="#dee5ec"/>
    <rect x="897" y="743" width="111" height="34" rx="5" fill="#ffffff" stroke="#c9d4df"/>
    <text x="952" y="765" text-anchor="middle" font-size="16" fill="#263747">Cancel</text>
    <rect x="1020" y="743" width="108" height="34" rx="5" fill="#176dc1"/>
    <text x="1074" y="765" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Save</text>
  </g>
  <rect x="24.5" y="16.5" width="1151" height="767" rx="13" fill="none" stroke="#c9d5e4" stroke-width="1"/>
</svg>
